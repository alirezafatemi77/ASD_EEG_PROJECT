<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An automated preprocessing pipeline for a multi-paradigm pediatric ASD EEG corpus</title>
  <desc>Figure summarising the OpenNeuro ds006780 dataset, a four-stage MNE preprocessing pipeline, quality-control results across 2,201 recordings, and planned analyses.</desc>

  <style>
    .ink    { fill: #0b0b0b; }
    .ink2   { fill: #52514e; }
    .muted  { fill: #898781; }
    .blue   { fill: #2a78d6; }
    .white  { fill: #fcfcfb; }
    .eyebrow{ font-size: 10px; font-weight: 700; letter-spacing: 1.4px; fill: #898781; }
    .h1     { font-size: 31px; font-weight: 700; fill: #0b0b0b; }
    .sub    { font-size: 13.5px; fill: #52514e; }
    .stat   { font-size: 27px; font-weight: 700; fill: #0b0b0b; }
    .statlbl{ font-size: 11px; fill: #52514e; }
    .chip   { font-size: 11px; font-weight: 600; }
    .stagen { font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; fill: #86b6ef; }
    .stageh { font-size: 14.5px; font-weight: 700; fill: #fcfcfb; }
    .op     { font-size: 11px; fill: #dce9fa; }
    .out    { font-size: 10.5px; font-weight: 600; }
    .panelh { font-size: 13px; font-weight: 700; fill: #0b0b0b; }
    .panels { font-size: 10.5px; fill: #898781; }
    .tick   { font-size: 9.5px; fill: #898781; font-variant-numeric: tabular-nums; }
    .val    { font-size: 11px; font-weight: 700; fill: #0b0b0b; font-variant-numeric: tabular-nums; }
    .cap    { font-size: 10.5px; fill: #52514e; }
    .note   { font-size: 11px; fill: #52514e; }
    .foot   { font-size: 9.5px; fill: #898781; }
    .grid   { stroke: #e1e0d9; stroke-width: 1; }
    .axis   { stroke: #c3c2b7; stroke-width: 1; }
    .rule   { stroke: #e1e0d9; stroke-width: 1; }
  </style>

  <rect width="1600" height="900" fill="#fcfcfb"/>

  <!-- ══ TITLE ══════════════════════════════════════════════════════ -->
  <text class="h1" x="48" y="52">An automated preprocessing pipeline for a multi-paradigm pediatric ASD EEG corpus</text>
  <text class="sub" x="48" y="75">OpenNeuro ds006780 · BIDS-Derivatives · MNE-Python · reproducible, cloud-backed, fully logged</text>
  <line class="rule" x1="48" y1="92" x2="1552" y2="92"/>

  <!-- ══ BAND 1 — DATASET ═══════════════════════════════════════════ -->
  <text class="eyebrow" x="48" y="116">DATASET</text>

  <text class="stat" x="48" y="150">136</text>
  <text class="statlbl" x="48" y="168">participants — ASD 66 · TD 41 · sibling 28</text>

  <text class="stat" x="424" y="150">2,201</text>
  <text class="statlbl" x="424" y="168">recordings from 139 subjects, 4 paradigms</text>

  <text class="stat" x="800" y="150">141 h</text>
  <text class="statlbl" x="800" y="168">of raw EEG · BioSemi ActiveTwo 64 ch · 512 Hz</text>

  <text class="stat" x="1176" y="150">8–13</text>
  <text class="statlbl" x="1176" y="168">years old · ADOS-CSS, SRS-2, FSIQ, MABC scored</text>

  <!-- paradigm chips: processed -->
  <g>
    <rect x="48"  y="192" width="152" height="25" rx="4" fill="#cde2fb"/>
    <text class="chip" x="124" y="209" text-anchor="middle" fill="#184f95">Restingstate  686</text>
    <rect x="208" y="192" width="126" height="25" rx="4" fill="#cde2fb"/>
    <text class="chip" x="271" y="209" text-anchor="middle" fill="#184f95">motor  1,247</text>
    <rect x="342" y="192" width="100" height="25" rx="4" fill="#cde2fb"/>
    <text class="chip" x="392" y="209" text-anchor="middle" fill="#184f95">FAST  134</text>
    <rect x="450" y="192" width="86"  height="25" rx="4" fill="#cde2fb"/>
    <text class="chip" x="493" y="209" text-anchor="middle" fill="#184f95">IC  134</text>
    <text class="panels" x="548" y="209">processed</text>
  </g>
  <line class="rule" x1="618" y1="194" x2="618" y2="215"/>
  <!-- paradigm chips: not yet processed -->
  <g>
    <rect x="636" y="192" width="70" height="25" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/>
    <text class="chip" x="671" y="209" text-anchor="middle" fill="#898781">ASSR</text>
    <rect x="714" y="192" width="80" height="25" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/>
    <text class="chip" x="754" y="209" text-anchor="middle" fill="#898781">AVSRT</text>
    <rect x="802" y="192" width="102" height="25" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/>
    <text class="chip" x="853" y="209" text-anchor="middle" fill="#898781">Beep-Flash</text>
    <text class="panels" x="916" y="209">available in the corpus, not yet run</text>
  </g>

  <line class="rule" x1="48" y1="240" x2="1552" y2="240"/>

  <!-- ══ BAND 2 — PIPELINE ══════════════════════════════════════════ -->
  <text class="eyebrow" x="48" y="264">PIPELINE  ·  OpenNeuro S3  →  local derivatives  →  Google Cloud Storage</text>

  <!-- Stage 1 -->
  <g>
    <rect x="48" y="288" width="349" height="212" rx="8" fill="#2a78d6"/>
    <text class="stagen" x="70" y="314">STAGE 1</text>
    <text class="stageh" x="70" y="334">Filter &amp; bad channels</text>
    <text class="op" x="70" y="358">notch 60 Hz + all harmonics</text>
    <text class="op" x="70" y="374">bandpass 1–40 Hz  (motor 1–100)</text>
    <text class="op" x="70" y="390">resample 250 Hz  (motor 500)</text>
    <text class="op" x="70" y="406">LOF bad-channel detection</text>
    <text class="op" x="70" y="422">spherical interpolation</text>
    <rect x="70" y="452" width="305" height="26" rx="4" fill="#184f95"/>
    <text class="out" x="82" y="469" fill="#cde2fb">desc-preproc_eeg.fif</text>
  </g>
  <path d="M 401 394 L 425 394 M 419 389 L 425 394 L 419 399" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 2 -->
  <g>
    <rect x="433" y="288" width="349" height="212" rx="8" fill="#2a78d6"/>
    <text class="stagen" x="455" y="314">STAGE 2</text>
    <text class="stageh" x="455" y="334">ICA decomposition</text>
    <text class="op" x="455" y="358">average reference (projection)</text>
    <text class="op" x="455" y="374">Picard, extended · ortho = false</text>
    <text class="op" x="455" y="390">components auto from rank (≈ 55)</text>
    <text class="op" x="455" y="406">decim 3 · max_iter 500 · seed 42</text>
    <text class="op" x="455" y="422">mean fit 7.6 s · 4.6 CPU-hours total</text>
    <rect x="455" y="452" width="305" height="26" rx="4" fill="#184f95"/>
    <text class="out" x="467" y="469" fill="#cde2fb">desc-preproc_ica.fif</text>
  </g>
  <path d="M 786 394 L 810 394 M 804 389 L 810 394 L 804 399" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 3 -->
  <g>
    <rect x="818" y="288" width="349" height="212" rx="8" fill="#2a78d6"/>
    <text class="stagen" x="840" y="314">STAGE 3</text>
    <text class="stageh" x="840" y="334">ICLabel &amp; artifact removal</text>
    <text class="op" x="840" y="358">re-apply average reference</text>
    <text class="op" x="840" y="374">ICLabel — 7-class posterior</text>
    <text class="op" x="840" y="390">drop muscle · eye · heart · line ·</text>
    <text class="op" x="840" y="406">channel  where  p ≥ 0.80</text>
    <text class="op" x="840" y="422">keep brain + other</text>
    <rect x="840" y="452" width="305" height="26" rx="4" fill="#184f95"/>
    <text class="out" x="852" y="469" fill="#cde2fb">desc-clean_eeg.fif   +   iclabel_components.tsv</text>
  </g>
  <path d="M 1171 394 L 1195 394 M 1189 389 L 1195 394 L 1189 399" fill="none" stroke="#898781" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stage 4 — in progress -->
  <g>
    <rect x="1203" y="288" width="349" height="212" rx="8" fill="#fcfcfb" stroke="#eda100" stroke-width="2" stroke-dasharray="7 5"/>
    <text class="stagen" x="1225" y="314" style="fill:#898781">STAGE 4</text>
    <text class="stageh" x="1225" y="334" style="fill:#0b0b0b">Epoching</text>
    <rect x="1418" y="301" width="112" height="20" rx="10" fill="#eda100"/>
    <text x="1474" y="315" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="0.8" fill="#3d2b00">IN PROGRESS</text>
    <text class="op" x="1225" y="358" style="fill:#52514e">fixed 2 s — Restingstate</text>
    <text class="op" x="1225" y="374" style="fill:#52514e">event −0.2 to +0.8 s — FAST, IC, motor</text>
    <text class="op" x="1225" y="390" style="fill:#52514e">events from BIDS annotations only</text>
    <text class="op" x="1225" y="406" style="fill:#52514e">no baseline correction, no rejection</text>
    <text class="op" x="1225" y="422" style="fill:#898781">smoke-tested; batch run pending</text>
    <rect x="1225" y="452" width="305" height="26" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1"/>
    <text class="out" x="1237" y="469" style="fill:#52514e">desc-epo.fif</text>
  </g>

  <!-- design-decision annotation, Stage 2 → Stage 3 -->
  <path d="M 607 500 L 607 514 Q 607 522 615 522 L 984 522 Q 992 522 992 514 L 992 506" fill="none" stroke="#eda100" stroke-width="1.5"/>
  <path d="M 987 511 L 992 505 L 997 511" fill="none" stroke="#eda100" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="note" x="800" y="542" text-anchor="middle">The ICA fit is computed <tspan font-weight="700">once</tspan> and reused — and the average reference is held consistent across the split, so Stage 3 applies the solution Stage 2 was fit on.</text>

  <line class="rule" x1="48" y1="562" x2="1552" y2="562"/>

  <!-- ══ BAND 3 — QUALITY CONTROL ═══════════════════════════════════ -->
  <text class="eyebrow" x="48" y="584">QUALITY CONTROL</text>

  <!-- Panel 1 — throughput stat tiles -->
  <text class="panelh" x="48" y="608">Throughput</text>
  <text class="panels" x="48" y="624">share of the 2,201 recordings completing each stage</text>

  <text class="stat" x="48" y="660" style="fill:#2a78d6">98.0%</text>
  <text class="statlbl" x="152" y="652">Stage 1 — filter &amp; bad channels</text>
  <text class="panels" x="152" y="666">2,157 succeeded · 44 failed</text>

  <text class="stat" x="48" y="706" style="fill:#2a78d6">99.9%</text>
  <text class="statlbl" x="152" y="698">Stage 2 — ICA decomposition</text>
  <text class="panels" x="152" y="712">2,168 of 2,171 attempted · 3 failed</text>

  <text class="stat" x="48" y="752" style="fill:#2a78d6">98.5%</text>
  <text class="statlbl" x="152" y="744">Stage 3 — ICLabel &amp; removal</text>
  <text class="panels" x="152" y="758">2,167 cleaned files written · 46 GB</text>

  <!-- Panel 2 — bad-channel histogram -->
  <text class="panelh" x="460" y="608">Bad channels detected per recording</text>
  <text class="panels" x="460" y="624">n = 2,157 · median 7 of 64 · IQR 3–11 · max 34 · final two bins are wider</text>

  <line class="grid" x1="494" y1="645" x2="1012" y2="645"/>
  <line class="grid" x1="494" y1="694" x2="1012" y2="694"/>
  <text class="tick" x="488" y="648" text-anchor="end">350</text>
  <text class="tick" x="488" y="697" text-anchor="end">175</text>
  <text class="tick" x="488" y="745" text-anchor="end">0</text>

  <g fill="#2a78d6">
    <path d="M 497 742 L 497 695 Q 497 691 501 691 L 539 691 Q 543 691 543 695 L 543 742 Z"/>
    <path d="M 549 742 L 549 682 Q 549 678 553 678 L 591 678 Q 595 678 595 682 L 595 742 Z"/>
    <path d="M 600 742 L 600 672 Q 600 668 604 668 L 642 668 Q 646 668 646 672 L 646 742 Z"/>
    <path d="M 652 742 L 652 650 Q 652 646 656 646 L 694 646 Q 698 646 698 650 L 698 742 Z"/>
    <path d="M 704 742 L 704 672 Q 704 668 708 668 L 746 668 Q 750 668 750 672 L 750 742 Z"/>
    <path d="M 756 742 L 756 683 Q 756 679 760 679 L 798 679 Q 802 679 802 683 L 802 742 Z"/>
    <path d="M 808 742 L 808 704 Q 808 700 812 700 L 850 700 Q 854 700 854 704 L 854 742 Z"/>
    <path d="M 859 742 L 859 705 Q 859 701 863 701 L 901 701 Q 905 701 905 705 L 905 742 Z"/>
    <path d="M 911 742 L 911 687 Q 911 683 915 683 L 953 683 Q 957 683 957 687 L 957 742 Z"/>
    <path d="M 963 742 L 963 714 Q 963 710 967 710 L 1005 710 Q 1009 710 1009 714 L 1009 742 Z"/>
  </g>
  <text class="val" x="675" y="640" text-anchor="middle">348</text>
  <line class="axis" x1="494" y1="742" x2="1012" y2="742"/>

  <g class="tick" text-anchor="middle">
    <text x="520" y="757">0</text>
    <text x="572" y="757">1–2</text>
    <text x="623" y="757">3–4</text>
    <text x="675" y="757">5–6</text>
    <text x="727" y="757">7–8</text>
    <text x="779" y="757">9–10</text>
    <text x="831" y="757">11–12</text>
    <text x="882" y="757">13–14</text>
    <text x="934" y="757">15–19</text>
    <text x="986" y="757">20–34</text>
  </g>
  <text class="panels" x="753" y="774" text-anchor="middle">bad channels per recording</text>
  <text class="cap" x="460" y="792"><tspan font-weight="700">91.4%</tspan> of recordings required interpolation — automated detection is not optional at this scale.</text>

  <!-- Panel 3 — ICA components excluded by task -->
  <text class="panelh" x="1052" y="608">ICA components excluded, by paradigm</text>
  <text class="panels" x="1052" y="624">mean % of the decomposition removed · n = 2,151</text>

  <g>
    <text class="statlbl" x="1052" y="657">motor</text>
    <path d="M 1162 642 L 1479 642 Q 1483 642 1483 646 L 1483 660 Q 1483 664 1479 664 L 1162 664 Z" fill="#2a78d6"/>
    <text class="val" x="1491" y="658">9.8%</text>

    <text class="statlbl" x="1052" y="691">IC</text>
    <path d="M 1162 676 L 1345 676 Q 1349 676 1349 680 L 1349 694 Q 1349 698 1345 698 L 1162 698 Z" fill="#2a78d6"/>
    <text class="val" x="1357" y="692">5.7%</text>

    <text class="statlbl" x="1052" y="725">FAST</text>
    <path d="M 1162 710 L 1296 710 Q 1300 710 1300 714 L 1300 728 Q 1300 732 1296 732 L 1162 732 Z" fill="#2a78d6"/>
    <text class="val" x="1308" y="726">4.2%</text>

    <text class="statlbl" x="1052" y="759">Restingstate</text>
    <path d="M 1162 744 L 1276 744 Q 1280 744 1280 748 L 1280 762 Q 1280 766 1276 766 L 1162 766 Z" fill="#2a78d6"/>
    <text class="val" x="1288" y="760">3.6%</text>
  </g>
  <line class="axis" x1="1162" y1="772" x2="1516" y2="772"/>
  <text class="cap" x="1052" y="792">Artifact load tracks motor demand — the treadmill task is noisiest. Detected, not assumed.</text>

  <line class="rule" x1="48" y1="806" x2="1552" y2="806"/>

  <!-- ══ BAND 4 — OUTLOOK ═══════════════════════════════════════════ -->
  <text class="eyebrow" x="48" y="826">WHAT THIS ENABLES</text>

  <rect x="48" y="836" width="1504" height="36" rx="6" fill="#f2f1ed"/>
  <text class="statlbl" x="70" y="859" font-weight="600">Batch Stage 4 epoching</text>
  <text class="muted" x="356" y="859" font-size="13">→</text>
  <text class="statlbl" x="392" y="859" font-weight="600">Extend to ASSR · AVSRT · Beep-Flash</text>
  <text class="muted" x="732" y="859" font-size="13">→</text>
  <text class="statlbl" x="768" y="859" font-weight="600">Alpha peak · N170 · mu-ERD · induced gamma</text>
  <text class="muted" x="1140" y="859" font-size="13">→</text>
  <text class="statlbl" x="1176" y="859" font-weight="600">Dimensional models vs. ADOS-CSS &amp; SRS-2</text>

  <text class="foot" x="48" y="888">Counts derived from per-stage run logs (2026-04-30 – 2026-06-25), deduplicated to the latest attempt per subject × task × run; Stage 3 figure is the on-disk file count. Stage 4 epoch windows are provisional pending event-timing validation.</text>
</svg>
